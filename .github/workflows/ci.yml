name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r mcp_services/after_sales_server/requirements.txt

      - name: Run lint
        run: ruff check --select E4,E7,E9,F src tests scripts mcp_services/after_sales_server/src

      - name: Compile sources
        run: python -m compileall -q src scripts mcp_services/after_sales_server/src

      - name: Run tests
        run: pytest -q
